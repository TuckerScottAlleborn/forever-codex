<!doctype html>
<!-- Source for ../races/og.png (1200x630 link-preview image). Regenerate with python og/build.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans+SC:wght@700&family=Alegreya:ital@0;1&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden }
  body {
    background:
      radial-gradient(ellipse 900px 420px at 50% -60px, rgba(195,154,242,.26), transparent 70%),
      radial-gradient(ellipse 700px 300px at 50% 700px, rgba(207,154,82,.12), transparent 70%),
      #0d0c14;
    color: #ece3cc; font-family: "Alegreya", Georgia, serif;
    display: grid; place-items: center;
  }
  .frame {
    position: absolute; inset: 28px; border: 2px solid rgba(207,154,82,.55);
    box-shadow: inset 0 0 0 6px #0d0c14, inset 0 0 0 8px rgba(207,154,82,.22);
  }
  .frame::before, .frame::after, .d1, .d2 { content: ""; position: absolute; width: 16px; height: 16px; background: #cf9a52; transform: rotate(45deg) }
  .frame::before { top: -9px; left: -9px } .frame::after { top: -9px; right: -9px }
  .d1 { bottom: -9px; left: -9px } .d2 { bottom: -9px; right: -9px }
  .inner { position: relative; display: grid; justify-items: center; gap: 20px; text-align: center }
  .eyebrow { font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; letter-spacing: .14em; font-size: 26px; color: #cf9a52; text-transform: lowercase }
  h1 {
    margin: 0; font-family: "Marcellus SC", Georgia, serif; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: .02em;
    background: linear-gradient(180deg, #f4c76b, #cf9a52 75%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.6));
  }
  .thesis { font-size: 34px; font-style: italic; margin: 0 }
  .thesis b { font-style: normal; color: #c39af2; font-weight: 400 }
  .row { display: flex; gap: 26px; margin-top: 16px }
  .r { display: grid; justify-items: center; gap: 10px }
  .slot {
    width: 84px; height: 84px; display: grid; place-items: center; border: 2px solid #000; border-radius: 5px; color: var(--cc);
    background: radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--cc) 38%, #1c2230), #07090e 80%);
    box-shadow: inset 0 0 0 2px rgba(207,154,82,.6), 0 2px 0 #000;
  }
  .slot svg { width: 58%; height: 58% }
  .r span { font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: lowercase; color: var(--cc) }
  .c-human { --cc: #8fb0f2 } .c-dwarf { --cc: #e08a4c } .c-nightelf { --cc: #b48cf2 } .c-gnome { --cc: #f08cc8 } .c-skyborne { --cc: #6fd0dc }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-human" viewBox="0 0 24 24"><path d="M12 2.5 L20 5.5 V11.5 C20 16.5 16.6 20 12 21.5 C7.4 20 4 16.5 4 11.5 V5.5 Z" fill="currentColor"/><path d="M12 6.5v10M8 10.5h8" stroke="#07090e" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-dwarf" viewBox="0 0 24 24"><path d="M2.5 7.5h12.5c0 2.6 2.2 4.2 6.5 4.2V13.6h-6l-1.3 3.4h2.8v2.5H7v-2.5h2.8L8.5 13.6H6.2C4 13.6 2.5 11.2 2.5 7.5z" fill="currentColor"/></symbol>
    <symbol id="i-nightelf" viewBox="0 0 24 24"><path d="M15.5 2.8A9.3 9.3 0 1 0 21.2 17.6 7.6 7.6 0 0 1 15.5 2.8z" fill="currentColor"/><circle cx="17.6" cy="6.4" r="1.15" fill="currentColor"/></symbol>
    <symbol id="i-gnome" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.3" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M5.4 18.6l2.1-2.1M16.5 7.5l2.1-2.1" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-skyborne" viewBox="0 0 24 24"><path d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h14.5a3 3 0 1 1-3 3M3 16.5h6.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div class="frame"><i class="d1"></i><i class="d2"></i></div>
<div class="inner">
  <div class="eyebrow">forever codex · book iii · alliance races vs. vanilla</div>
  <h1>The Races</h1>
  <p class="thesis">Racial weapon skill is gone. A race picks <b>a kind of power</b>.</p>
  <div class="row">
    <div class="r c-human"><div class="slot"><svg><use href="#i-human"/></svg></div><span>human</span></div>
    <div class="r c-dwarf"><div class="slot"><svg><use href="#i-dwarf"/></svg></div><span>dwarf</span></div>

    <div class="r c-skyborne"><div class="slot"><svg><use href="#i-skyborne"/></svg></div><span>skyborne</span></div>
  </div>
</div>
</body>
</html>
