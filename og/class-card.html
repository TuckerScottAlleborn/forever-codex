<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden }
  body {
    background:
      radial-gradient(ellipse 760px 520px at 18% 50%, color-mix(in oklab, var(--cc) 22%, transparent), transparent 70%),
      radial-gradient(ellipse 900px 420px at 60% -80px, rgba(58,108,208,.30), transparent 70%),
      #0d0c14;
    color: #ece2c8; font-family: "Alegreya", Georgia, serif;
  }
  .frame {
    position: absolute; inset: 28px; border: 2px solid rgba(207,154,82,.55);
    box-shadow: inset 0 0 0 6px #0d0c14, inset 0 0 0 8px rgba(207,154,82,.22);
  }
  .frame::before, .frame::after, .d1, .d2 { content: ""; position: absolute; width: 16px; height: 16px; background: #cf9a52; transform: rotate(45deg) }
  .frame::before { top: -9px; left: -9px } .frame::after { top: -9px; right: -9px }
  .d1 { bottom: -9px; left: -9px } .d2 { bottom: -9px; right: -9px }
  .layout { position: absolute; inset: 28px; display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 56px; padding: 0 80px 0 90px }
  .slot {
    width: 300px; height: 300px; position: relative; display: grid; place-items: center; border: 3px solid #000; border-radius: 10px; color: var(--cc);
    background: radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--cc) 40%, #1c2230), #07090e 80%);
    box-shadow: inset 0 0 0 4px rgba(207,154,82,.7), 0 0 60px -10px color-mix(in oklab, var(--cc) 60%, transparent), 0 4px 0 #000;
  }
  .slot svg { width: 60%; height: 60%; filter: drop-shadow(0 0 18px color-mix(in oklab, var(--cc) 50%, transparent)) }
  .slot span { position: absolute; top: 8px; right: 16px; font: 700 34px/1.2 system-ui, sans-serif; color: #eee; text-shadow: 0 0 4px #000, 0 0 4px #000 }
  .text { display: grid; gap: 18px; align-content: center }
  .eyebrow { font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; letter-spacing: .14em; font-size: 24px; color: #cf9a52; text-transform: lowercase }
  h1 { margin: 0; font-family: "Marcellus SC", Georgia, serif; font-weight: 400; font-size: 120px; line-height: .95; color: var(--cc); filter: drop-shadow(0 3px 0 rgba(0,0,0,.7)) }
  .specs { font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .06em; color: #a39b88; text-transform: lowercase }
  .lede { margin: 0; font-size: 34px; line-height: 1.25; font-style: italic; max-width: 22em }
  .dist { display: grid; gap: 10px; margin-top: 8px; max-width: 560px }
  .xp { height: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: #000; border: 2px solid rgba(207,154,82,.55); border-radius: 3px }
  .xp i { display: block; background: color-mix(in oklab, var(--cc) 12%, #1a1a1a) }
  .xp i.on { background: linear-gradient(180deg, color-mix(in oklab, var(--cc) 75%, #fff), var(--cc) 55%, color-mix(in oklab, var(--cc) 60%, #000)) }
  .xp i.half { background: linear-gradient(90deg, var(--cc) 50%, color-mix(in oklab, var(--cc) 12%, #1a1a1a) 50%) }
  .dist p { margin: 0; display: flex; justify-content: space-between; font-family: "Alegreya Sans", sans-serif; font-size: 24px; color: #a39b88 }
  .dist b { color: var(--cc) }
</style>
</head>

    <symbol id="i-mage" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/></symbol>

  <div class="text">

  </div>
</div>
<script>
  var cls = JSON.parse(decodeURIComponent(location.hash.slice(1) || "%7B%7D"));
  document.documentElement.style.setProperty("--cc", cls.color);
  document.getElementById("icon").setAttribute("href", "#i-" + cls.id);
  document.getElementById("key").textContent = cls.key;
  document.getElementById("name").textContent = cls.name;
  document.getElementById("specs").textContent = cls.specs;
  document.getElementById("lede").textContent = cls.card;
  document.getElementById("lv").textContent = cls.level;
  var xp = document.getElementById("xp");
  for (var i = 1; i <= 4; i++) {
    var seg = document.createElement("i");
    if (i <= cls.dist) seg.className = "on"; else if (i - 0.5 === cls.dist) seg.className = "half";
    xp.appendChild(seg);
  }
</script>
